name: Security and build checks

on:
  push:
    branches:
      - fix/security-card-access-regressions
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-tests:
    name: API authorization regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run security unit and route tests
        run: pnpm --filter @convocarry/api exec vitest run __tests__/card-access.test.ts __tests__/security-routes.test.ts __tests__/oauth-exchange.test.ts

  monorepo-build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm --filter @convocarry/api exec prisma generate
      - name: Check TypeScript
        run: pnpm typecheck
      - name: Build workspace
        run: pnpm build

  postgres-isolation:
    name: Real PostgreSQL user-isolation tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: convocarry_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/convocarry_test?schema=public
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: local-test-only-not-production
      JWT_SECRET: integration-test-jwt-secret-32-chars-at-minimum
      CRON_SECRET: integration-test-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm --filter @convocarry/api exec prisma generate
      - name: Initialize isolated test database
        run: pnpm --filter @convocarry/api exec prisma db push
      - name: Run multi-user PostgreSQL security tests
        run: pnpm --filter @convocarry/api exec vitest run __tests__/api-isolation.integration.test.ts

  extension-regressions:
    name: Extension capture, auth and browser regression tests
    # Match the OS supported by our pinned Playwright release.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run adapter and local storage/session tests
        run: pnpm --filter @convocarry/adapters --filter @convocarry/extension test
      - name: Build local extension
        run: pnpm --filter @convocarry/extension build
      - name: Install test browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Test capture through insertion in Chromium fixtures
        run: pnpm test:browser
